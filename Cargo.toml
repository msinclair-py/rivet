[workspace]
resolver = "2"
members = [
    "stamp-core",
    "stamp-cli",
    "stamp-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["msinclair"]
license = "MIT"
repository = "https://github.com/msinclair/rivet"
description = "Rivet - Structural Alignment of Multiple Proteins"
rust-version = "1.70"
readme = "README.md"
keywords = ["bioinformatics", "protein", "structure", "alignment", "stamp"]
categories = ["science", "algorithms"]

[workspace.dependencies]
# Core dependencies
nalgebra = "0.33"
thiserror = "1.0"
log = "0.4"

# CLI dependencies
clap = { version = "4.5", features = ["derive", "env"] }
env_logger = "0.11"

# Python bindings
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"

# Internal crates
stamp-core = { path = "stamp-core" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Allow common patterns in scientific/numerical code
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
similar_names = "allow"  # i1, j1, i2, j2 are intentional in alignment code
too_many_lines = "allow"  # Complex algorithms may need long functions
inconsistent_digit_grouping = "allow"  # Mathematical constants
unreadable_literal = "allow"  # Mathematical constants
collapsible_if = "allow"  # Sometimes clearer when separate
missing_panics_doc = "allow"
suspicious_op_assign_impl = "allow"  # Used intentionally in matrix operations
cognitive_complexity = "allow"  # Complex algorithms are complex

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
lto = true
codegen-units = 1

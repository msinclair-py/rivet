[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "rivet-rs"
version = "0.1.1"
description = "Rivet - Structural Alignment of Multiple Proteins"
readme = "README.md"
license-file = "LICENSE"
requires-python = ">=3.9"
authors = [
    { name = "msinclair" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["bioinformatics", "protein", "structure", "alignment", "rivet"]

dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/msinclair/rivet"
Documentation = "https://github.com/msinclair/rivet"
Repository = "https://github.com/msinclair/rivet"

[tool.maturin]
manifest-path = "stamp-py/Cargo.toml"
python-source = "stamp-py/python"
module-name = "rivet"
features = ["pyo3/extension-module"]
strip = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["stamp-py/tests"]
pythonpath = ["stamp-py/python"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-ra", "-q", "--strict-markers"]

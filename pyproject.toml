[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "rivet"
version = "0.1.0"
description = "Rivet - Structural Alignment of Multiple Proteins"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "msinclair" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["bioinformatics", "protein", "structure", "alignment", "rivet"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/msinclair/rivet"
Documentation = "https://github.com/msinclair/rivet"
Repository = "https://github.com/msinclair/rivet"

[tool.maturin]
manifest-path = "stamp-py/Cargo.toml"
features = ["extension-module"]
module-name = "rivet"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
